[package]
name = "entity-gym-rs"
version = "0.9.0"
authors = ["Clemens Winter <clemenswinter1@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust bindings for the entity-gym library"
readme = "README.md"
repository = "https://github.com/entity-neural-network/entity-gym-rs"

[lib]
crate-type = ["cdylib", "rlib"]
name = "entity_gym_rs"

[dependencies]
bevy = { version = "0.20.1", optional = true, default-features = false, features = ["bevy_asset", "std", "multi_threaded"] }
rand = "0.10"
ragged-buffer = "0.4.9"
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }
numpy = { version = "0.30", optional = true }
ndarray = "0.17"
crossbeam = "0.8.1"
rustc-hash = "1.0"
atomicbox = "0.4.0"
rogue-net = "0.5.0"



crossbeam-channel = "0.5"

entity-gym-derive = { path = "entity-gym-derive", version = "0.2.1" }
arrayvec = "0.7.2"



[features]
python = ["pyo3", "numpy", "ragged-buffer/python"]
bevy = ["dep:bevy"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
